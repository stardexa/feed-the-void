name: Nib Interaction

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: nib-state
  cancel-in-progress: false

jobs:
  interact:
    if: startsWith(github.event.issue.title, 'nib:') || startsWith(github.event.issue.title, '[nib:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Let Nib react
        run: node scripts/interact.js
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
      - name: Save Nib's new mood
        run: |
          git config user.name "nib-bot[bot]"
          git config user.email "nib-bot[bot]@users.noreply.github.com"
          git add README.md data/state.json assets/nib.svg
          git diff --cached --quiet || git commit -m "chore: Nib reacted to an issue"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Thank the caretaker and close the issue
        run: node scripts/reply.js
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
